# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = 'catppuccin_mocha'

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'

[directory]
truncation_length = 3
truncation_symbol = '…/'
home_symbol = '🏠'
format = '[$path]($style)[$read_only]($read_only_style) '

[aws]
disabled = true

[line_break]
disabled = true

[hostname]
ssh_symbol = ' 🛜'
# format = '@[$hostname$ssh_symbol]($style)'
format = '@[$hostname]($style)'

[username]
format = '[$user]($style)'
# aliases = { "aj" = "matchai" }

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
symbol = '🌱'

[git_status]
disabled = true

[localip]
format = '[\($localipv4\)]($style) '
disabled = true

[os]
disabled = true

[python]
disabled = true

[terraform]
disabled = false
# format = '[\[tf $version\]]($style) '

[shell]
disabled = false
zsh_indicator = ''
bash_indicator = ''
powershell_indicator = '⌗'

[package]
format = '[pkg:\($symbol$version\)]($style) '
symbol = '📦'
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

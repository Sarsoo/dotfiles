# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

# success_symbol = '[➜](bold green)'

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'

[directory]
truncation_length = 8
truncation_symbol = '…/'
home_symbol = '🏠'
format = '\[[$path]($style)[$read_only]($read_only_style)\] '

[aws]
disabled = true

[line_break]
disabled = true

[hostname]
ssh_symbol = ' 🛜'
# format = '@[$hostname$ssh_symbol]($style)'
format = '@[$hostname]($style)'

[username]
format = '[$user]($style)'
# aliases = { "aj" = "matchai" }

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
symbol = '🌱'

[git_status]
disabled = true

[localip]
format = '[\($localipv4\)]($style) '
disabled = false

[os]
disabled = true

[python]
disabled = true

[terraform]
disabled = false
# format = '[\[tf $version\]]($style) '

[package]
format = '[pkg:\($symbol$version\)]($style) '
symbol = '📦'